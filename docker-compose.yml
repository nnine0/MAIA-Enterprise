version: '3.8'

services:
  # LoRAX Inference Server
  # Multi-LoRA inference server that hosts base model + all adapters
  lorax-kernel:
    image: ghcr.io/predibase/lorax:main
    container_name: maia-lorax
    ports:
      - "8080:80"
    volumes:
      - ./adapters:/data/adapters
    environment:
      - MODEL_ID=google/gemma-4-26b-a4b-it
      - NUM_SHARD=1
      - MAX_BATCH_PREFILL_TOKENS=4096
      - MAX_TOTAL_TOKENS=8192
      - HUGGINGFACE_HUB_CACHE=/data/models
      - PORT=80
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model-id google/gemma-4-26b-a4b-it
      --num-shard 1
      --max-batch-prefill-tokens 4096
      --max-total-tokens 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Quad-Node GPU Cluster
  # Each node runs a governed MAIA kernel on shared GPU
  
  maia-node-1:
    build: .
    image: maia-enterprise:latest
    container_name: maia-estimating
    ports:
      - "8001:8000"
    environment:
      - NODE_ID=estimating
      - NODE_PORT=8001
      - LORAX_URL=http://lorax-kernel:80
      - COMPLIANCE_CONFIG=configs/compliance/generic_contractor_v1.json
    depends_on:
      lorax-kernel:
        condition: service_started
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    command: python3 server.py

  maia-node-2:
    build: .
    image: maia-enterprise:latest
    container_name: maia-legal
    ports:
      - "8002:8000"
    environment:
      - NODE_ID=legal
      - NODE_PORT=8002
      - LORAX_URL=http://lorax-kernel:80
      - COMPLIANCE_CONFIG=configs/compliance/generic_contractor_v1.json
    depends_on:
      lorax-kernel:
        condition: service_started
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    command: python3 server.py

  maia-node-3:
    build: .
    image: maia-enterprise:latest
    container_name: maia-safety
    ports:
      - "8003:8000"
    environment:
      - NODE_ID=safety
      - NODE_PORT=8003
      - LORAX_URL=http://lorax-kernel:80
      - COMPLIANCE_CONFIG=configs/compliance/generic_contractor_v1.json
    depends_on:
      lorax-kernel:
        condition: service_started
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    command: python3 server.py

  maia-node-4:
    build: .
    image: maia-enterprise:latest
    container_name: maia-logistics
    ports:
      - "8004:8000"
    environment:
      - NODE_ID=logistics
      - NODE_PORT=8004
      - LORAX_URL=http://lorax-kernel:80
      - COMPLIANCE_CONFIG=configs/compliance/generic_contractor_v1.json
    depends_on:
      lorax-kernel:
        condition: service_started
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    command: python3 server.py

  # Shared services
  dashboard:
    build: .
    image: maia-enterprise:latest
    container_name: maia-dashboard
    ports:
      - "3033:3033"
    environment:
      - NODE_ID=dashboard
    volumes:
      - ./logs:/app/logs
    depends_on:
      - maia-node-1
      - maia-node-2
      - maia-node-3
      - maia-node-4
    command: python3 -m http.server 3033

  # Governance audit trail
  forensics:
    build: .
    image: maia-enterprise:latest
    container_name: maia-forensics
    ports:
      - "9000:9000"
    volumes:
      - ./logs:/app/logs
    environment:
      - NODE_ID=forensics
    command: tail -f /dev/null

networks:
  default:
    driver: bridge
    ipam:
      config:
        subnet: 172.28.0.0/16