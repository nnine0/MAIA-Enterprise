version: '3.8'

# MAIA Enterprise - Compliance Appliance
# Single command deployment with data persistence

networks:
  maia-net:
    driver: bridge

volumes:
  maia-data:
    driver: local
  maia-adapters:
    driver: local

services:
  # === INFERENCE ENGINE (LoRAX) ===
  lorax:
    image: ghcr.io/predibase/lorax:latest
    container_name: maia-lorax
    networks:
      - maia-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - maia-data:/data
      - maia-adapters:/adapters
    shm_size: '2gb'
    command: >
      --model-id Nanbeige/Nanbeige4-3B-Thinking-2511
      --max-batch-prefill-tokens 4096
      --gpu-memory-utilization 0.8
      --trust-remote-code
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "8080:80"

  # === VECTOR DATABASE (Qdrant) ===
  vector-db:
    image: qdrant/qdrant:latest
    container_name: maia-qdrant
    networks:
      - maia-net
    restart: unless-stopped
    volumes:
      - maia-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "6333:6333"

  # === TASK QUEUE (Redis) ===
  redis:
    image: redis:alpine
    container_name: maia-redis
    networks:
      - maia-net
    restart: unless-stopped
    volumes:
      - maia-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "6379:6379"

  # === GOVERNANCE CONTROLLER ===
  maia-app:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: app
    container_name: maia-controller
    networks:
      - maia-net
    restart: unless-stopped
    depends_on:
      lorax:
        condition: service_healthy
      vector-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - LORAX_URL=http://lorax:80
      - QDRANT_URL=http://vector-db:6333
      - REDIS_URL=redis://redis:6379/0
      - CUDA_VISIBLE_DEVICES=
    env_file:
      - .env
    volumes:
      - maia-data:/data_logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8000:8000"
      - "3033:3033"

  # === BACKGROUND WORKER ===
  maia-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: worker
    container_name: maia-worker
    networks:
      - maia-net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      lorax:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    environment:
      - LORAX_URL=http://lorax:80
      - QDRANT_URL=http://vector-db:6333
      - REDIS_URL=redis://redis:6379/0
      - CUDA_VISIBLE_DEVICES=
    env_file:
      - .env
    volumes:
      - maia-data:/data_logs
      - maia-adapters:/adapters
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info"]