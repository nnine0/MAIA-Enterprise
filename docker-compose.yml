version: '3.8'

services:
  # Quad-Node GPU Cluster
  # Each node runs a governed MAIA kernel on shared GPU
  
  maia-node-1:
    build: .
    image: maia-enterprise:latest
    container_name: maia-estimating
    ports:
      - "8001:8000"
    environment:
      - NODE_ID=estimating
      - NODE_PORT=8001
      - GPU_MEMORY_UTIL=0.23
      - LORA_ADAPTER=estimating_lora
      - COMPLIANCE_CONFIG=configs/compliance/jacksonville_contractor_v1.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    command: python3 server.py

  maia-node-2:
    build: .
    image: maia-enterprise:latest
    container_name: maia-legal
    ports:
      - "8002:8000"
    environment:
      - NODE_ID=legal
      - NODE_PORT=8002
      - GPU_MEMORY_UTIL=0.23
      - LORA_ADAPTER=legal_lora
      - COMPLIANCE_CONFIG=configs/compliance/jacksonville_contractor_v1.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    command: python3 server.py

  maia-node-3:
    build: .
    image: maia-enterprise:latest
    container_name: maia-safety
    ports:
      - "8003:8000"
    environment:
      - NODE_ID=safety
      - NODE_PORT=8003
      - GPU_MEMORY_UTIL=0.23
      - LORA_ADAPTER=safety_lora
      - COMPLIANCE_CONFIG=configs/compliance/jacksonville_contractor_v1.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    command: python3 server.py

  maia-node-4:
    build: .
    image: maia-enterprise:latest
    container_name: maia-logistics
    ports:
      - "8004:8000"
    environment:
      - NODE_ID=logistics
      - NODE_PORT=8004
      - GPU_MEMORY_UTIL=0.23
      - LORA_ADAPTER=logistics_lora
      - COMPLIANCE_CONFIG=configs/compliance/jacksonville_contractor_v1.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    command: python3 server.py

  # Shared services
  dashboard:
    build: .
    image: maia-enterprise:latest
    container_name: maia-dashboard
    ports:
      - "3033:3033"
    environment:
      - NODE_ID=dashboard
    volumes:
      - ./logs:/app/logs
    depends_on:
      - maia-node-1
      - maia-node-2
      - maia-node-3
      - maia-node-4
    command: python3 -m http.server 3033

  # Governance audit trail
  forensics:
    build: .
    image: maia-enterprise:latest
    container_name: maia-forensics
    ports:
      - "9000:9000"
    volumes:
      - ./logs:/app/logs
    environment:
      - NODE_ID=forensics
    command: tail -f /dev/null

networks:
  default:
    driver: bridge
    ipam:
      config:
        subnet: 172.28.0.0/16