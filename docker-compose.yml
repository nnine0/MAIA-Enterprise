version: '3.8'

networks:
  maia-net:
    driver: bridge

# GPU Allocation:
# - lorax: GPU 0 (inference) - 80% VRAM
# - Other services: CPU only (call lorax via HTTP)
# Note: Only 1 GPU per machine - lorax is the inference engine

services:
  # --- INFERENCE KERNEL (LoRAX) ---
  lorax:
    image: ghcr.io/predibase/lorax:latest
    container_name: maia-lorax
    networks:
      - maia-net
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8080:80"
    volumes:
      - ~/.cache/huggingface:/data
      - ./adapters:/adapters
    shm_size: '2gb'
    command: >
      --model-id Nanbeige/Nanbeige4-3B-Thinking-2511
      --max-batch-prefill-tokens 4096
      --gpu-memory-utilization 0.8
      --trust-remote-code
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --- MEMORY (Qdrant) ---
  vector-db:
    image: qdrant/qdrant:latest
    container_name: maia-qdrant
    networks:
      - maia-net
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- TASK QUEUE (Redis) ---
  redis:
    image: redis:alpine
    container_name: maia-redis
    networks:
      - maia-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- CONTROLLER (CPU only - governance, calls lorax) ---
  maia-app:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: app
    container_name: maia-controller
    networks:
      - maia-net
    depends_on:
      lorax:
        condition: service_healthy
      vector-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - LORAX_URL=http://lorax:80
      - QDRANT_URL=http://vector-db:6333
      - REDIS_URL=redis://redis:6379/0
      - CUDA_VISIBLE_DEVICES=  # Empty = CPU only
    environment_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2G

  # --- CELERY WORKER (CPU only - background tasks) ---
  maia-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: worker
    container_name: maia-worker
    networks:
      - maia-net
    depends_on:
      redis:
        condition: service_healthy
      lorax:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    environment:
      - LORAX_URL=http://lorax:80
      - QDRANT_URL=http://vector-db:6333
      - REDIS_URL=redis://redis:6379/0
      - CUDA_VISIBLE_DEVICES=  # Empty = CPU only
    environment_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 4G
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info"]