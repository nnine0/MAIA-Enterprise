<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIA Control Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            background: #0a0e14;
            color: #e6edf3;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #21262d;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #238636, #3fb950);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Traffic Light */
        .traffic-container {
            display: flex;
            gap: 8px;
            padding: 16px;
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #21262d;
        }
        
        .traffic-light {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid #1a1f2a;
            transition: all 0.3s;
        }
        
        .light-red { 
            background: #21262d;
        }
        .light-red.active {
            background: #f85149;
            box-shadow: 0 0 30px #f85149;
        }
        
        .light-yellow {
            background: #21262d;
        }
        .light-yellow.active {
            background: #d29922;
            box-shadow: 0 0 30px #d29922;
        }
        
        .light-green {
            background: #21262d;
        }
        .light-green.active {
            background: #3fb950;
            box-shadow: 0 0 30px #3fb950;
        }
        
        .status-label {
            text-align: center;
            font-size: 10px;
            text-transform: uppercase;
            color: #8b949e;
            margin-top: 4px;
        }
        
        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-top: 24px;
        }
        
        .card {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #21262d;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-body {
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        /* Adapter Toggle */
        .adapter-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .adapter-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #21262d;
            border-radius: 8px;
        }
        
        .adapter-name {
            font-weight: 500;
        }
        
        .adapter-status {
            font-size: 12px;
            color: #8b949e;
        }
        
        .toggle {
            position: relative;
            width: 48px;
            height: 24px;
        }
        
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #30363d;
            border-radius: 24px;
            transition: 0.3s;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        
        .toggle input:checked + .toggle-slider {
            background: #238636;
        }
        
        .toggle input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        
        .toggle.locked {
            opacity: 0.5;
            pointer-events: none;
        }
        
        .premium-badge {
            font-size: 10px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
        }
        
        /* Log */
        .log-entry {
            display: flex;
            gap: 12px;
            padding: 10px 12px;
            border-bottom: 1px solid #21262d;
            font-size: 13px;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: #8b949e;
            font-size: 11px;
            min-width: 80px;
        }
        
        .log-action {
            flex: 1;
        }
        
        .log-status {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        
        .status-allowed {
            background: rgba(63, 185, 80, 0.2);
            color: #3fb950;
        }
        
        .status-blocked {
            background: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }
        
        .status-escalated {
            background: rgba(210, 153, 34, 0.2);
            color: #d29922;
        }
        
        /* EKG */
        .ekg-container {
            height: 150px;
            position: relative;
        }
        
        /* Stats */
        .stat-row {
            display: flex;
            gap: 16px;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
            padding: 16px;
            background: #21262d;
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #58a6ff;
        }
        
        .stat-label {
            font-size: 11px;
            color: #8b949e;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">✓</div>
                MAIA Control Center
            </div>
            <div id="current-time">--:--:--</div>
        </header>
        
        <div class="grid">
            <!-- Traffic Light -->
            <div class="card">
                <div class="card-header">
                    <span>Compliance Status</span>
                </div>
                <div class="card-body" style="display: flex; justify-content: center; align-items: center;">
                    <div class="traffic-container">
                        <div>
                            <div class="traffic-light light-red" id="light-red"></div>
                            <div class="status-label">Critical</div>
                        </div>
                        <div>
                            <div class="traffic-light light-yellow" id="light-yellow"></div>
                            <div class="status-label">Warning</div>
                        </div>
                        <div>
                            <div class="traffic-light light-green active" id="light-green"></div>
                            <div class="status-label">Safe</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Stats -->
            <div class="card">
                <div class="card-header">
                    <span>Live Statistics</span>
                </div>
                <div class="card-body">
                    <div class="stat-row">
                        <div class="stat-item">
                            <div class="stat-value" id="stat-requests">0</div>
                            <div class="stat-label">Requests</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-blocked">0</div>
                            <div class="stat-label">Blocked</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-escalated">0</div>
                            <div class="stat-label">Escalated</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- EKG -->
            <div class="card">
                <div class="card-header">
                    <span>Intent Log (Neural EKG)</span>
                </div>
                <div class="card-body">
                    <div class="ekg-container">
                        <canvas id="ekg-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <!-- Adapter Toggles -->
            <div class="card" style="grid-column: 1 / -1;">
                <div class="card-header">
                    <span>Compliance Adapters</span>
                    <span style="font-size:12px;color:#8b949e">Active Policy</span>
                </div>
                <div class="card-body">
                    <div class="adapter-list" id="adapter-list">
                        <!-- Adapters rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <!-- Recent Activity -->
            <div class="card" style="grid-column: 1 / -1;">
                <div class="card-header">
                    <span>Intent Log</span>
                    <span style="font-size:12px;color:#8b949e">Real-time</span>
                </div>
                <div class="card-body" id="intent-log">
                    <!-- Logs rendered by JS -->
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // State
        let stats = { requests: 0, blocked: 0, escalated: 0 };
        let ekgChart = null;
        
        // Adapters config
        const adapters = [
            { id: 'sr26-02', name: 'SR 26-02 (Fed)', enabled: true, locked: false },
            { id: 'gdpr', name: 'GDPR (Europe)', enabled: false, locked: true, premium: true },
            { id: 'hipaa', name: 'HIPAA (Healthcare)', enabled: false, locked: true, premium: true },
            { id: 'osha', name: 'OSHA (Construction)', enabled: true, locked: false },
            { id: 'pci', name: 'PCI-DSS (Payments)', enabled: false, locked: true, premium: true },
            { id: 'ccpa', name: 'CCPA (Privacy)', enabled: false, locked: true, premium: true },
        ];
        
        // Render adapters
        function renderAdapters() {
            const container = document.getElementById('adapter-list');
            container.innerHTML = adapters.map(a => `
                <div class="adapter-item">
                    <div>
                        <div class="adapter-name">${a.name}${a.premium ? '<span class="premium-badge">PREMIUM</span>' : ''}</div>
                        <div class="adapter-status">${a.enabled ? 'Active' : 'Inactive'}</div>
                    </div>
                    <label class="toggle ${a.locked ? 'locked' : ''}">
                        <input type="checkbox" ${a.enabled ? 'checked' : ''} ${a.locked ? 'disabled' : ''} 
                               onchange="toggleAdapter('${a.id}', this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            `).join('');
        }
        
        function toggleAdapter(id, enabled) {
            const adapter = adapters.find(a => a.id === id);
            if (adapter && !adapter.locked) {
                adapter.enabled = enabled;
                renderAdapters();
            }
        }
        
        // Render log
        const logEntries = [];
        
        function addLogEntry(action, status) {
            const now = new Date();
            const time = now.toLocaleTimeString();
            
            logEntries.unshift({ time, action, status });
            if (logEntries.length > 20) logEntries.pop();
            
            // Update stats
            stats.requests++;
            if (status === 'BLOCKED') stats.blocked++;
            if (status === 'ESCALATED') stats.escalated++;
            
            renderLog();
            updateStats();
            updateTrafficLight();
        }
        
        function renderLog() {
            const container = document.getElementById('intent-log');
            container.innerHTML = logEntries.map(e => `
                <div class="log-entry">
                    <span class="log-time">${e.time}</span>
                    <span class="log-action">${e.action}</span>
                    <span class="log-status status-${e.status.toLowerCase()}">${e.status}</span>
                </div>
            `).join('');
        }
        
        function updateStats() {
            document.getElementById('stat-requests').textContent = stats.requests;
            document.getElementById('stat-blocked').textContent = stats.blocked;
            document.getElementById('stat-escalated').textContent = stats.escalated;
        }
        
        function updateTrafficLight() {
            const red = document.getElementById('light-red');
            const yellow = document.getElementById('light-yellow');
            const green = document.getElementById('light-green');
            
            if (stats.blocked > 0) {
                red.classList.add('active');
                yellow.classList.remove('active');
                green.classList.remove('active');
            } else if (stats.escalated > 0) {
                red.classList.remove('active');
                yellow.classList.add('active');
                green.classList.remove('active');
            } else {
                red.classList.remove('active');
                yellow.classList.remove('active');
                green.classList.add('active');
            }
        }
        
        // EKG Chart
        function initEKG() {
            const ctx = document.getElementById('ekg-chart').getContext('2d');
            ekgChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        borderColor: '#3fb950',
                        backgroundColor: 'rgba(63, 185, 80, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { display: false },
                        y: { 
                            min: 0, 
                            max: 100,
                            grid: { color: '#21262d' },
                            ticks: { display: false }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
        
        function updateEKG(value) {
            const now = new Date().toLocaleTimeString();
            ekgChart.data.labels.push(now);
            ekgChart.data.datasets[0].data.push(value);
            
            if (ekgChart.data.labels.length > 30) {
                ekgChart.data.labels.shift();
                ekgChart.data.datasets[0].data.shift();
            }
            
            ekgChart.update();
        }
        
        // Demo traffic
        function simulateTraffic() {
            const actions = [
                { action: "Wire $50k to Russia", status: "BLOCKED" },
                { action: "Check patient record", status: "BLOCKED" },
                { action: "Calculate credit score", status: "ALLOWED" },
                { action: "Process loan application", status: "ESCALATED" },
                { action: "Verify compliance", status: "ALLOWED" },
                { action: "Audit transaction", status: "ALLOWED" },
                { action: "Access PII data", status: "BLOCKED" },
            ];
            
            const rand = Math.random();
            if (rand < 0.3) {
                const bad = actions.filter(a => a.status === 'BLOCKED');
                const entry = bad[Math.floor(Math.random() * bad.length)];
                addLogEntry(entry.action, entry.status);
                updateEKG(80 + Math.random() * 20);
            } else if (rand < 0.5) {
                const warn = actions.filter(a => a.status === 'ESCALATED');
                const entry = warn[Math.floor(Math.random() * warn.length)];
                addLogEntry(entry.action, entry.status);
                updateEKG(50 + Math.random() * 20);
            } else {
                const good = actions.filter(a => a.status === 'ALLOWED');
                const entry = good[Math.floor(Math.random() * good.length)];
                addLogEntry(entry.action, entry.status);
                updateEKG(20 + Math.random() * 20);
            }
        }
        
        // Initialize
        function init() {
            renderAdapters();
            renderLog();
            initEKG();
            updateStats();
            
            // Add initial entries
            addLogEntry("Calculate credit score", "ALLOWED");
            addLogEntry("Verify compliance", "ALLOWED");
            addLogEntry("Process loan application", "ALLOWED");
            
            // Time
            setInterval(() => {
                document.getElementById('current-time').textContent = new Date().toLocaleTimeString();
            }, 1000);
            
            // Simulate
            setInterval(simulateTraffic, 3000);
        }
        
        init();
    </script>
</body>
</html>
