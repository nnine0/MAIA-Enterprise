version: '3.9'

services:
  # ========================================================================
  # LAYER 7: Global Switchboard (The Toll Booth)
  # ========================================================================
  # Routes 16 banks to 4 governance cells (4 banks per cell).
  # Executes cross-bank contagion detection before routing.
  # 1ms handoff to designated 20GB MIG partition.
  #
  # Cell allocation:
  #   Cell 0: Citi, BofA, Wells, Chase
  #   Cell 1: JPM, Goldman, MS, UBS
  #   Cell 2: HSBC, Barclays, DB, Citi Europe
  #   Cell 3: BNP, SG, TD, Scotiabank

  global-switchboard:
    build: .
    image: maia-enterprise:latest
    container_name: maia-switchboard
    ports:
      - "8000:8000"
      - "8001:8001"
      - "9090:9090"
    ipc: host
    ulimits:
      memlock: -1
    environment:
      - NODE_ID=global-switchboard
      - CELLS=4
      - BANKS_PER_CELL=4
      - TOTAL_BANKS=16
      - CROSS_BANK_CONTAGION_CHECK=true
      - CONTAGION_THRESHOLD=0.85
      - IPC_MODE=shared_memory
    volumes:
      - ./adapters:/data/adapters
      - ./configs:/app/configs
      - ./logs:/app/logs
      - /dev/shm:/dev/shm
    command: python3 -c "
import sys; sys.path.insert(0, 'app')
from routing import GlobalSwitchboard
sb = GlobalSwitchboard(cells=4, banks_per_cell=4)
print('L7 Global Switchboard: 16 banks → 4 cells')
print(sb.get_routing_table())
"

  # ========================================================================
  # CELL 0: Partition 0 — Citi, BofA, Wells, Chase
  # ========================================================================
  # VRAM: 20 GB (Gemma 26B A4B + Nemotron Sheriff + Granite Sentinel)
  # Capacity: ~20 TPS per bank × 4 = 80 TPS total
  # Isolation: SR 26-02 Section VI compliant (no logic leaks)

  cell-0-sglang:
    image: ghcr.io/sglang/sglang:latest
    container_name: maia-cell0-sglang
    ipc: host
    ulimits:
      memlock: -1
      nofile: 65536
    volumes:
      - /models:/models
      - ./adapters:/data/adapters
      - /dev/shm:/dev/shm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              minor: 0
    command: >
      python -m sglang.launch_server
      --model-path google/gemma-4-26B-A4B
      --draft-model z-lab/gemma-4-E4B-it-DFlash
      --enable-dflash
      --dflash-block-size 16
      --port 3000
      --enable-torch-compile
      --enable-radix-cache
      --mem-fraction-static 0.88

  cell-0-lorax:
    image: ghcr.io/predibase/lorax:latest
    container_name: maia-cell0-lorax
    ports:
      - "8080:80"
    ipc: host
    ulimits:
      memlock: -1
    environment:
      - CELL_ID=0
      - BANKS=citi,bofa,wells,chase
      - ADAPTERS=citi-finance-expert-v4,bofa-credit-risk-v4,wells-fraud-aml-v4,chase-legal-v1
    volumes:
      - /models:/models
      - ./adapters:/data/adapters
      - /dev/shm:/dev/shm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              minor: 0
    depends_on:
      - cell-0-sglang
    command: >
      --model-id google/gemma-4-26B-A4B
      --quantize nvfp4
      --sgmv

