      --sgmv

  # ========================================================================
  # CROSS-BANK CONTAGION DETECTOR (Layer 8 Shared)
  # ========================================================================
  # Monitors latent-space intersections between banks.
  # If Bank A's trajectory will cause liquidity crisis at Bank B,
  # Circuit Breaker trips for BOTH banks.
  contagion-detector:
    build: .
    image: maia-enterprise:latest
    container_name: maia-contagion-detector
    ports:
      - "9091:9091"
    ipc: host
    environment:
      - NODE_ID=contagion-detector
      - THRESHOLD=0.85
      - SCAN_INTERVAL_MS=500
      - CIRCUIT_BREAKER_TRIGGER=true
    volumes:
      - ./logs:/app/logs
      - /dev/shm:/dev/shm
    command: python3 -c "
import sys; sys.path.insert(0, 'app')
from contagion_detector import ContagionMonitor
monitor = ContagionMonitor(threshold=0.85)
print('Cross-Bank Contagion Monitor active')
print('Scanning 16 banks for latent trajectory intersections...')
"

  # ========================================================================
  # Dashboard: Real-time EKG for All 16 Banks
  # ========================================================================
  dashboard:
    image: python:3.11-slim
    container_name: maia-dashboard-clearinghouse
    ports:
      - "3033:3033"
    environment:
      - NODE_ID=dashboard
    volumes:
      - ./logs:/app/logs
    command: >
      sh -c "pip install streamlit pandas plotly &&
      streamlit run docs/dashboard.py --server.port 3033 --server.address 0.0.0.0"

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16