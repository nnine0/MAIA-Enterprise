version: '3.9'

services:
  # MAIA H100 Neural Refinery — 4-Bank Multi-Tenant Deployment
  # =========================================================
  # One H100 governs 4 Tier-1 banks simultaneously.
  # Each bank gets physical isolation at KV-cache and adapter layers.
  #
  # Capacity Math:
  #   H100: ~80-120 concurrent governed trajectories/sec
  #   Peak per bank: ~20 TPS (high-stakes Tier-1 decisions)
  #   Result: 80 TPS / 20 TPS per bank = 4 banks per H100 node
  #
  # Cost-of-Compliance Reduction: 90%
  # Governance Margin: 99.1% (vs 15% human model)
  # Annual License Revenue: $4M ($1M/bank)
  # Hardware Cost: $35K one-time H100

  sglang-refinery:
    image: ghcr.io/sglang/sglang:latest
    container_name: maia-sglang-refinery
    ports:
      - "3000:3000"
      - "3001:3001"
    ipc: host
    ulimits:
      memlock: -1
      nofile: 65536
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - /models:/models
      - ./adapters:/data/adapters
      - /dev/shm:/dev/shm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    command: >
      python -m sglang.launch_server
      --model-path google/gemma-4-26B-A4B
      --draft-model z-lab/gemma-4-E4B-it-DFlash
      --enable-dflash
      --dflash-block-size 16
      --port 3000
      --enable-torch-compile
      --enable-flashinfer
      --enable-radix-cache
      --chunked-prefill-size 8192
      --enable-tp
      --tensor-parallel-size 1
      --mem-fraction-static 0.88
      --evict-type lru

  lorax-refinery:
    image: ghcr.io/predibase/lorax:latest
    container_name: maia-lorax-refinery
    ports:
      - "8080:80"
    ipc: host
    ulimits:
      memlock: -1
      nofile: 65536
    environment:
      - NUM_SHARD=1
      - MAX_BATCH_PREFILL_TOKENS=16384
      - MAX_TOTAL_TOKENS=32768
      - SGMV_ENABLED=true
    volumes:
      - /models:/models
      - ./adapters:/data/adapters
      - /dev/shm:/dev/shm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      sglang-refinery:
        condition: service_healthy
    command: >
      --model-id google/gemma-4-26B-A4B
      --num-shard 1
      --max-batch-prefill-tokens 16384
      --max-total-tokens 32768
      --quantize nvfp4
      --sgmv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ============================================================
  # MAIA Multi-Tenant Orchestrator
  # ============================================================
  # Each bank is tenant-isolated via:
  #   1. KV-Cache Namespacing (RadixAttention partitions)
  #   2. Adapter Multi-Tenancy (SGMV batched, weights distinct)
  #   3. Signed Kafka Streams (bank-specific audit trail)
  maia-orchestrator:
    build: .
    image: maia-enterprise:latest
    container_name: maia-orchestrator-refinery
    ports:
      - "8000:8000"
      - "8001:8001"
    ipc: host
    ulimits:
      memlock: -1
    environment:
      - NODE_ID=refinery-orchestrator
      - SGLANG_URL=http://sglang-refinery:3000
      - LORAX_URL=http://lorax-refinery:80
      - MULTI_TENANT_MODE=true
      - MAX_TENANTS=4
      - DFASH_MODE=industrial
      - DFASH_BLOCK_SIZE=16
      - INTERCEPT_TYPE=dflash_block
      - IPC_MODE=shared_memory
    volumes:
      - ./adapters:/data/adapters
      - ./configs:/app/configs
      - ./logs:/app/logs
      - /dev/shm:/dev/shm
    depends_on:
      sglang-refinery:
        condition: service_healthy
      lorax-refinery:
        condition: service_healthy
    command: python3 server.py

  # ============================================================
  # Bank 1: Citi (Finance / Credit)
  # ============================================================
  bank-citi:
    image: python:3.11-slim
    container_name: maia-bank-citi
    environment:
      - TENANT_ID=citi
      - TENANT_NAME=Citi
      - SECTOR=finance
      - ADAPTER_ID=citi-finance-expert-v4
      - API_URL=http://maia-orchestrator:8000
    command: >
      sh -c "echo 'Bank: Citi | Sector: Finance | Adapter: citi-finance-expert-v4
      Throughput: ~20 TPS peak | Governance: SR 26-02' && sleep infinity"

  # ============================================================
  # Bank 2: BofA (Credit / Risk)
  # ============================================================
  bank-bofa:
    image: python:3.11-slim
    container_name: maia-bank-bofa
    environment:
      - TENANT_ID=bofa
      - TENANT_NAME="Bank of America"
      - SECTOR=credit
      - ADAPTER_ID=bofa-credit-risk-v4
      - API_URL=http://maia-orchestrator:8000
    command: >
      sh -c "echo 'Bank: BofA | Sector: Credit | Adapter: bofa-credit-risk-v4
      Throughput: ~20 TPS peak | Governance: SR 26-02' && sleep infinity"

  # ============================================================
  # Bank 3: Wells Fargo (Compliance / Fraud)
  # ============================================================
  bank-wells:
    image: python:3.11-slim
    container_name: maia-bank-wells
    environment:
      - TENANT_ID=wells
      - TENANT_NAME="Wells Fargo"
      - SECTOR=compliance
      - ADAPTER_ID=wells-fraud-aml-v4
      - API_URL=http://maia-orchestrator:8000
    command: >
      sh -c "echo 'Bank: Wells Fargo | Sector: Compliance/Fraud | Adapter: wells-fraud-aml-v4
      Throughput: ~20 TPS peak | Governance: AML/SAR' && sleep infinity"

  # ============================================================
  # Bank 4: Chase (Legal / Contract)
  # ============================================================
  bank-chase:
    image: python:3.11-slim
    container_name: maia-bank-chase
    environment:
      - TENANT_ID=chase
      - TENANT_NAME="JPMorgan Chase"
      - SECTOR=legal
      - ADAPTER_ID=chase-legal-v1
      - API_URL=http://maia-orchestrator:8000
    command: >
      sh -c "echo 'Bank: Chase | Sector: Legal/Contract | Adapter: chase-legal-v1
      Throughput: ~20 TPS peak | Governance: Privilege/FAR' && sleep infinity"

  # ============================================================
  # Per-Tenant Kafka Audit Streams
  # ============================================================
  kafka-citi:
    image: confluentinc/cp-kafka:latest
    container_name: maia-kafka-citi
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-citi:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_LOG_RETENTION_HOURS=8760
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    command: >
      bash -c "echo 'Creating topic: maia-audit-citi' &&
      /etc/confluent/docker/run"

  # ============================================================
  # Dashboard: Real-time EKG for All 4 Banks
  # ============================================================
  dashboard:
    image: python:3.11-slim
    container_name: maia-dashboard-refinery
    ports:
      - "3033:3033"
    environment:
      - NODE_ID=dashboard
    volumes:
      - ./logs:/app/logs
    command: >
      sh -c "pip install streamlit pandas plotly &&
      streamlit run docs/dashboard.py --server.port 3033 --server.address 0.0.0.0"

  # ============================================================
  # Zookeeper
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: maia-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16