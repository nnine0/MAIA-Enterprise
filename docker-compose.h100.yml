# MAIA H100 Neural Refinery - Production Deployment
# =============================================
# Targeting Tier-1 banks (Citi, BofA) with Multi-Tenancy & High-Resolution Logging
#
# Architecture:
# - L9: LoRAX Kernel (gemma-4-26b-a4b + MTP/DFlash)
# - L8: PVI Airlock (Nemotron auditor)
# - L7: API Gateway (FastAPI + Kong)
# - L6: Kafka Audit Stream (SR 26-02 compliance)
#
# Deploy: docker-compose -f docker-compose.h100.yml up -d

version: '3.8'

services:
  # ==========================================
  # LAYER 9: The Engine (LoRAX Kernel)
  # ==========================================
  lorax-kernel:
    image: ghcr.io/predibase/lorax:latest
    container_name: maia-lorax-kernel
    # H100 80GB: 62GB free after base model
    # Load 5 warm adapters = ~12GB each (cached in VRAM)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - MODEL_ID=google/gemma-4-26b-a4b-it
      - MTP_ADAPTER_ID=google/gemma-4-mtp-drafter
      - MAX_BATCH_PREFILL_TOKENS=16384
      - MAX_TOTAL_TOKENS=32768
      - GPU_MEMORY_FRACTION=0.85
      - ADAPTER_CACHE_DIR=/adapters
    volumes:
      - ./adapters:/adapters:ro
      - ./logs/lorax:/logs
    ports:
      - "8080:80"
    shm_size: '16gb'
    command: >
      --model-id ${MODEL_ID:-google/gemma-4-26b-a4b-it}
      --draft-model z-lab/gemma-4-E4B-it-DFlash
      --enable-dflash
      --dflash-block-size 16
      --adapter-id /adapters/citi-finance-expert-v4
      --adapter-id /adapters/bofa-credit-risk-v4
      --adapter-id /adapters/fed-pvi-airlock-sr2602
      --adapter-id /adapters/legal-contract-redline-v1
      --adapter-id /adapters/construction-safety-v1
      --max-batch-prefill-tokens 16384
      --max-total-tokens 32768
      --max-batch-size 16
    networks:
      - maia-internal

  # ==========================================
  # LAYER 8: The Auditor (PVI Airlock)
  # ==========================================
  pvi-airlock:
    build:
      context: .
      dockerfile: Dockerfile.airlock
    container_name: maia-pvi-airlock
    environment:
      - AUDITOR_MODEL=${AUDITOR_MODEL:-nvidia/nemotron-cascade}
      - MATERIALITY_THRESHOLD=0.85
      - LORAX_URL=http://lorax-kernel:80
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP=kafka:9092
      - LOG_LEVEL=INFO
      - TENANT_ISOLATION=enabled
      - VRAM_PARTITIONING=enabled
      - EPHEMERAL_TTL=60
    depends_on:
      lorax-kernel:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./logs/airlock:/logs
      - ./configs/materiality:/config:ro
    networks:
      - maia-internal
    deploy:
      resources:
        limits:
          memory: 16G

  # ==========================================
  # LAYER 7: The Hand (API Gateway)
  # ==========================================
  maia-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: maia-gateway
    environment:
      - LORAX_URL=http://lorax-kernel:80
      - AIRLOCK_URL=http://pvi-airlock:8000
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP=kafka:9092
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - RATE_LIMIT_REQUESTS=1000
      - RATE_LIMIT_PERIOD=3600
      - NODE_ID=maia-gateway-primary
    ports:
      - "443:8443"
      - "80:8080"
    depends_on:
      lorax-kernel:
        condition: service_healthy
      pvi-airlock:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs/gateway:/logs
      - ./certs:/certs:ro
    networks:
      - maia-internal
    deploy:
      resources:
        limits:
          memory: 4G

  # ==========================================
  # LAYER 6: Evidence (Kafka Audit Stream)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: maia-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    volumes:
      - ./logs/kafka:/var/lib/kafka/data
    networks:
      - maia-internal

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: maia-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - maia-internal

  # ==========================================
  # STATE: Redis (Ephemeral Memory)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: maia-redis
    command: >
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --timeout 60
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./logs/redis:/data
    networks:
      - maia-internal
    deploy:
      resources:
        limits:
          memory: 6G

  # ==========================================
  # DASHBOARD: Testing Telemetry
  # ==========================================
  dashboard:
    build: .
    dockerfile: Dockerfile.dashboard
    container_name: maia-testing-dashboard
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - API_URL=http://maia-gateway:8443
    ports:
      - "3034:3033"
    depends_on:
      - kafka
      - maia-gateway
    volumes:
      - ./logs/dashboard:/logs
    networks:
      - maia-internal

networks:
  maia-internal:
    driver: bridge
    ipam:
      config:
        subnet: 172.28.0.0/16

volumes:
  adapters:
  logs: