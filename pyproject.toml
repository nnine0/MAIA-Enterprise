[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maia"
version = "0.1.0"
description = "Multi-Agent Intelligent Assistant - PROPRIETARY"
authors = [{name = "MAIA Team"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PROPRIETARY - NO COMMERCIAL USE"}
classifiers = [
    "License :: Other",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "openai",
    "qdrant-client",
    "sentence-transformers",
    "llm-guard",
    "rank-bm25",
    "nltk",
    "celery",
    "redis",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "black",
    "isort",
    "flake8",
    "mypy",
    "bandit",
    "safety",
    "pre-commit",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.maia.lint]
pass_env = ["PYTHONPATH"]

[tool.maia.scripts]
lint-bypass = "python3 scripts/check_bypass_imports.py --ci"
lint-all = "python3 scripts/check_bypass_imports.py --ci && python3 -m pytest tests/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"